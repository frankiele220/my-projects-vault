<!doctype html><html lang="en" data-theme="hacker" data-pal="mocha"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Projects Vault</title>
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#17181c;--muted:#5f5d57;--line:#e3ddd1;--acc:#c2410c;--ok:#15803d;--warn:#b45309;--bar:#ece6da;
 --space1:#1b1d2a;--space2:#0d0e15;--glow:255,196,120}
@media(prefers-color-scheme:dark){:root{--bg:#121116;--panel:#1d1c22;--ink:#efece6;--muted:#aaa59b;--line:#34313a;--acc:#fb923c;--ok:#4ade80;--warn:#facc15;--bar:#2a2830}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 32px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0}.mut{color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;border:1px solid var(--line)}
.pill.run{color:var(--ok);border-color:var(--ok)}.pill.pause{color:var(--warn);border-color:var(--warn)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 16px;min-height:36px;cursor:pointer;background:var(--ink);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.prog{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.prog .big{font-size:26px;font-weight:800;min-width:84px}.bar{flex:1;min-width:180px;height:10px;background:var(--bar);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}.nums{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.nums b{color:var(--ink);font-size:16px}
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px;align-items:start}@media(max-width:900px){.main{grid-template-columns:1fr}}
/* left: the archive, a slowly turning sphere of pictures in a dark space */
#space{position:relative;height:640px;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,var(--space1),var(--space2) 70%);border:1px solid var(--line)}
@media(max-width:600px){#space{height:440px}}
#space .stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 22%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff6,transparent),
 radial-gradient(1.5px 1.5px at 85% 68%,#fff7,transparent),radial-gradient(1px 1px at 30% 80%,#fff5,transparent),radial-gradient(1px 1px at 55% 55%,#fff4,transparent),
 radial-gradient(1px 1px at 8% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 45% 8%,#fff6,transparent),radial-gradient(1px 1px at 92% 35%,#fff5,transparent)}
.tile{position:absolute;left:0;top:0;width:34px;height:24px;margin:-12px 0 0 -17px;border-radius:4px;overflow:hidden;background:#2b2e40;
 box-shadow:0 0 0 1px rgba(255,255,255,.12);will-change:transform,opacity}
.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile.doc{background:linear-gradient(#3a3e55 0 30%,#2b2e40 30%)}
.tile.lit{box-shadow:0 0 0 2px rgb(var(--glow)),0 0 18px 6px rgba(var(--glow),.7)}
#space .lbl{position:absolute;left:14px;top:12px;color:#e9e6f5;font-weight:800;font-size:14px;letter-spacing:.02em;z-index:200}
#space .cur{position:absolute;left:14px;right:14px;bottom:12px;color:#b9b6c9;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:200}
/* right: project folders */
#right{min-width:0}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.bin{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.bin span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bin b{color:var(--ink);font-size:17px}.bin.hit{box-shadow:0 0 0 2px var(--warn)}
#folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-height:640px;overflow:auto;padding:2px}
.folder{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;transition:box-shadow .3s,transform .3s;min-width:0}
.folder.hit{box-shadow:0 0 0 2px var(--acc),0 0 22px rgba(var(--glow),.55);transform:translateY(-2px)}
.fh{display:flex;align-items:center;gap:8px;min-width:0}.fh svg{flex:none}
.fh .nm{flex:1;min-width:0;font-weight:700;font-size:13px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badge{flex:none;min-width:26px;text-align:center;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;color:#11111b}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.slot{aspect-ratio:4/3;border-radius:4px;background:var(--bar);overflow:hidden}.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.rv{box-shadow:inset 0 0 0 2px var(--warn)}
/* comets */
#sky{position:fixed;inset:0;pointer-events:none;z-index:20}
.trail{position:absolute;left:0;top:0;overflow:visible}
.trail{position:absolute;inset:0;width:100%;height:100%}.trail path{fill:none;stroke:rgb(var(--glow));stroke-linecap:round}.trail .glow{stroke-width:8;opacity:.18}.trail .core{stroke-width:2}
.head{position:absolute;left:0;top:0;width:72px;height:52px;margin:-26px 0 0 -36px;border-radius:7px;overflow:hidden;border:2px solid #fff;
 box-shadow:0 0 24px 8px rgba(var(--glow),.75);will-change:transform,opacity;background:#2b2e40}
.head img{width:100%;height:100%;object-fit:cover;display:block}.head.rv{border-color:var(--warn)}
.spark{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;will-change:transform,opacity;
 background:radial-gradient(circle,#fff 0,rgba(var(--glow),.95) 35%,rgba(var(--glow),0) 70%)}
.spark.dim{background:radial-gradient(circle,#ddd 0,rgba(160,160,180,.8) 35%,rgba(160,160,180,0) 70%)}
.spark.amber{background:radial-gradient(circle,#fff 0,rgba(250,204,21,.9) 35%,rgba(250,204,21,0) 70%)}
@media(prefers-reduced-motion:reduce){#sky{display:none}.folder,.tile{transition:none}}
/* rings around the sphere: centred on it, strokes that keep growing and shrinking */
.rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.rings circle{fill:none;stroke-linecap:butt}
.rings .c1{stroke:#fab387;stroke-width:7;opacity:.35}.rings .c2{stroke:#c9a46a;stroke-width:1.2;opacity:.5}.rings .c3{stroke:#fab387;stroke-width:1.2;opacity:.45}
html[data-theme="hacker"] .rings .c1{stroke:#fab387;opacity:.6}html[data-theme="hacker"] .rings .c2{stroke:#89dceb;opacity:.75}html[data-theme="hacker"] .rings .c3{stroke:#89dceb;opacity:.55}
/* fit the browser window: header and progress on top, the sphere and the folders share the rest of the height */
@media(min-width:901px){
 html,body{height:100%;overflow:hidden}
 .wrap{max-width:1680px;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:14px 18px}
 .main{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}
 #space{height:auto;min-height:0}
 #right{display:flex;flex-direction:column;min-height:0}
 #folders{flex:1;min-height:0;max-height:none}
}
/* scrollbars in the page's own style: thin, rounded, no arrows */
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
#folders{scroll-behavior:smooth;padding-right:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--sbh);background-clip:padding-box}::-webkit-scrollbar-corner{background:transparent}
:root{--sb:rgba(95,93,87,.35);--sbh:rgba(95,93,87,.6)}
@media(prefers-color-scheme:dark){:root{--sb:rgba(170,165,155,.3);--sbh:rgba(170,165,155,.55)}}
html[data-theme="hacker"]{--sb:rgba(137,220,235,.35);--sbh:rgba(137,220,235,.75)}
html[data-theme="hacker"] ::-webkit-scrollbar-track{background:rgba(137,220,235,.04);border-left:1px solid var(--line)}
html[data-theme="hacker"] ::-webkit-scrollbar-thumb{border-radius:1px;box-shadow:0 0 6px rgba(137,220,235,.4)}
/* footer: the picture counts, small, under everything */
.foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.foot .nums{gap:14px;font-size:12px}.foot .nums b{font-size:13px}
html[data-theme="hacker"] .foot .nums span{border:0;padding:0}
@media(min-width:901px){.foot{flex:none}}
/* live progress bar and counters */
.bar{position:relative}.bar i{position:relative;overflow:hidden;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar i::after{content:"";position:absolute;inset:0;width:38%;left:-38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
 mix-blend-mode:overlay;animation:sweep 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sweep{to{left:100%}}
.tip{position:absolute;top:0;bottom:0;width:6px;margin-left:2px;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:blink 1s steps(2,jump-none) infinite;transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes blink{50%{opacity:.15}}
.num{font-variant-numeric:tabular-nums}.num.rolling{color:var(--cy,var(--acc));text-shadow:0 0 8px rgba(137,220,235,.55)}
@media(prefers-reduced-motion:reduce){.bar i::after,.tip{animation:none}}
/* theme switch */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;margin-right:8px;vertical-align:middle}
.seg button{background:none;color:var(--muted);padding:4px 12px;min-height:28px;border-radius:999px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.tag{display:none}
/* ---------- Hacker theme: a dark control room, monospace, amber and cyan on a fine grid ---------- */
html[data-theme="hacker"]{--bg:#11111b;--panel:#181825;--ink:#cdd6f4;--muted:#7f849c;--line:#313244;--acc:#fab387;--ok:#a6e3a1;--warn:#fab387;--bar:#313244;
 --cy:#89dceb;--glow:137,220,235;--space1:#1e1e2e;--space2:#11111b}
html[data-theme="hacker"] body{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.01em;
 background-color:var(--bg);background-image:linear-gradient(rgba(137,220,235,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(137,220,235,.045) 1px,transparent 1px);background-size:24px 24px}
html[data-theme="hacker"] h1{font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--acc)}
html[data-theme="hacker"] .mut{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
html[data-theme="hacker"] .tag{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--cy);margin:0 0 6px}
html[data-theme="hacker"] .pill{border-radius:2px;text-transform:uppercase;letter-spacing:.1em;font-size:11px}
html[data-theme="hacker"] button{border-radius:2px;background:transparent;color:var(--acc);border:1px solid var(--acc);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
html[data-theme="hacker"] .seg{border-radius:2px;border-color:var(--line)}html[data-theme="hacker"] .seg button{border:0;color:var(--muted);border-radius:1px}
html[data-theme="hacker"] .seg button.on{background:var(--acc);color:#11111b}
html[data-theme="hacker"] .prog,html[data-theme="hacker"] .folder{border-radius:3px;background:var(--panel);border-color:var(--line);position:relative}
html[data-theme="hacker"] .prog::before,html[data-theme="hacker"] .prog::after,html[data-theme="hacker"] #space::before,html[data-theme="hacker"] #space::after{content:"";position:absolute;width:12px;height:12px;border:1px solid var(--cy);z-index:210;pointer-events:none}
html[data-theme="hacker"] .prog::before,html[data-theme="hacker"] #space::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
html[data-theme="hacker"] .prog::after,html[data-theme="hacker"] #space::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
html[data-theme="hacker"] .prog .big{color:var(--acc);font-weight:700;font-size:24px}
html[data-theme="hacker"] .bar{height:12px;border-radius:0;background:repeating-linear-gradient(90deg,var(--bar) 0 6px,transparent 6px 8px)}
html[data-theme="hacker"] .bar i{background:repeating-linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 8px);box-shadow:0 0 10px rgba(250,179,135,.5)}
html[data-theme="hacker"] .nums span{border:1px solid var(--line);padding:2px 8px;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
html[data-theme="hacker"] .nums b{color:var(--cy);font-size:14px}
html[data-theme="hacker"] #space{border-radius:3px;border-color:var(--line)}
html[data-theme="hacker"] #space .lbl{color:var(--acc);font-size:11px;text-transform:uppercase;letter-spacing:.18em}
html[data-theme="hacker"] #space .cur{color:var(--cy);font-size:11px}
html[data-theme="hacker"] .tile{border-radius:1px;box-shadow:0 0 0 1px rgba(137,220,235,.35);background:#313244}
html[data-theme="hacker"] .tile.doc{background:linear-gradient(#45475a 0 28%,#313244 28%)}
html[data-theme="hacker"] .folder{padding:8px 10px}
html[data-theme="hacker"] .folder.hit{box-shadow:0 0 0 1px var(--cy),0 0 18px rgba(137,220,235,.45)}
html[data-theme="hacker"] .fh .nm{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
html[data-theme="hacker"] .fh svg{filter:none}
html[data-theme="hacker"] .badge{background:transparent!important;border:1px solid var(--acc);color:var(--acc);border-radius:2px;font-size:11px}
html[data-theme="hacker"] .slot{border-radius:1px;background:#1e1e2e;box-shadow:inset 0 0 0 1px var(--line)}
html[data-theme="hacker"] .head{border-radius:2px;border:1px solid var(--cy)}
html[data-theme="hacker"] .spark{background:radial-gradient(circle,#fff 0,rgba(137,220,235,.95) 35%,rgba(137,220,235,0) 70%)}

 --bar:#313244;--cy:#89dceb;--glow:137,220,235;--glowa:250,179,135;--space1:#1e1e2e;--space2:#11111b;--tile:#313244;--tile2:#45475a;--slot:#1e1e2e;--on:#11111b;--txtglow:none}

/* the palette picker in the top bar */
.palsel{font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);background:var(--panel);border:1px solid var(--line);
 border-radius:2px;padding:6px 28px 6px 10px;min-height:32px;margin-right:8px;vertical-align:middle;cursor:pointer;appearance:none;-webkit-appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),linear-gradient(135deg,var(--acc) 50%,transparent 50%);
 background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);

let PAL=PALS.mocha;
function colour(ind){const k=String(ind||"").toLowerCase();if(/health|medic|clinic|care|pharm|lab/.test(k))return PAL[1];if(/fin|invest|bank|pay|loan|crypto/.test(k))return PAL[0];
 if(/retail|loyal|commerce|shop|food/.test(k))return PAL[2];let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];}

const S={folders:new Map(),bins:{skipped:0,unsure:0,review:0},last:0,queue:[],busy:false,state:null,tiles:[],angle:0};

// ---------- the archive: pictures on a slowly turning sphere (golden-spiral layout, depth shown by size and fade) ----------
function buildSphere(){const sp=$("space"),N=120;
 for(let i=0;i<N;i++){const y=1-(i+.5)/N*2,r=Math.sqrt(1-y*y),th=i*Math.PI*(3-Math.sqrt(5));

function spin(now){const sp=$("space"),W=sp.clientWidth,H=sp.clientHeight,R=Math.min(W,H)*0.36,cx=W/2,cy=H*0.47;

 const key=`${cx|0},${cy|0},${R|0}`;if(S.rk!==key){S.rk=key;cs.forEach((c,i)=>{c.setAttribute("cx",cx);c.setAttribute("cy",cy);c.setAttribute("r",(R*RING[i][0]).toFixed(1));});}
 if(REDUCE)return;cs.forEach((c,i)=>{const [a,g]=RING[i][1](s);c.style.strokeDasharray=`${a.toFixed(1)} ${g.toFixed(1)}`;c.style.strokeDashoffset=(s*RING[i][2]).toFixed(1);});}

// ---------- the project folders ----------
function folderCard(n,pop){if(S.folders.has(n.id))return S.folders.get(n.id);const col=colour(n.industry),el=document.createElement("div");el.className="folder";
 el.innerHTML=`<div class="fh">${FOLDER(col)}<span class="nm" title="${esc(n.name)}">${esc(n.name)}</span><span class="badge" style="background:${col}">0</span></div><div class="slots">${"<div class=slot></div>".repeat(6)}</div>`;
 el.tabIndex=0;el.setAttribute("role","button");el.onclick=()=>openFolder(n.id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openFolder(n.id);}};

 if(pop&&!REDUCE)el.animate([{transform:"scale(.6)",opacity:0},{transform:"scale(1.06)",opacity:1},{transform:"scale(1)"}],{duration:500,easing:"ease-out"});return f;}

 slots.prepend(s);while(slots.children.length>6)slots.lastChild.remove();}

function comet(o){return new Promise(done=>{const layer=$("trails");

const flies=ev=>ev.has_file&&ev.project_id&&(ev.status==="kept"||ev.status==="review");

async function pump(){if(S.busy)return;S.busy=true;const air=new Set();
 while(S.queue.length||air.size){
  if(!S.queue.length){await Promise.race(air);continue;}
  if(S.queue.length>40)S.queue.splice(0,S.queue.length-40).forEach(settle);   // far behind: file the oldest at once
  while(air.size>=3)await Promise.race(air);   // at most three pictures in the air
  const ev=S.queue.shift(),speed=Math.min(1.6,1+S.queue.length/20);ticker(ev);
  const fl=play(ev,speed).catch(()=>{}).finally(()=>air.delete(fl));air.add(fl);
  await new Promise(r=>setTimeout(r,Math.max(1000,1500/speed)));}   // the next one leaves 1 to 1.5 s later

 (function f(n){const u=Math.min(1,(n-t0)/D),e=1-Math.pow(1-u,3);let txt=fmt(from+(to-from)*e);
  if(u<0.75)txt=txt.replace(/\d(?=[^\d]*$)|\d(?=\d[^\d]*$)/g,()=>String(Math.random()*10|0));
  el.textContent=txt;if(u<1)el._raf=requestAnimationFrame(f);else{el.textContent=fmt(to);el.classList.remove("rolling");}})(t0);}

$("fvx").onclick=closeFolder;document.querySelectorAll(".tabs .tab").forEach(b=>b.onclick=()=>{FV.tab=b.dataset.t;setTab(b.dataset.t);});$("fv").onclick=e=>{if(e.target.id==="fv")closeFolder();};$("zoom").onclick=e=>{if(ZM.moved){ZM.moved=false;return;}if(e.target.id==="zoom"||e.target.classList.contains("zx"))$("zoom").classList.remove("on");};
$("zoom").querySelector(".zpub").onclick=e=>{e.stopPropagation();const x=FV.pics[FV.i];if(x)togglePublic(x);};
$("zoom").addEventListener("wheel",e=>{const img=$("zoom").querySelector("img");e.preventDefault();
 const r=img.getBoundingClientRect(),base={l:r.left-ZM.x,t:r.top-ZM.y},px=e.clientX-base.l,py=e.clientY-base.t;
 const s2=Math.min(8,Math.max(1,ZM.s*Math.exp(-e.deltaY*0.0015)));
 // keep the point under the cursor in place: (px - x) / s stays the same before and after
 ZM.x=px-(px-ZM.x)*s2/ZM.s;ZM.y=py-(py-ZM.y)*s2/ZM.s;ZM.s=s2;if(s2===1){ZM.x=0;ZM.y=0;}zoomApply();},{passive:false});
$("zoom").querySelector("img").addEventListener("mousedown",e=>{if(ZM.s<=1)return;e.preventDefault();ZM.drag={x:e.clientX-ZM.x,y:e.clientY-ZM.y};ZM.moved=false;$("zoom").classList.add("dragging");});
addEventListener("mousemove",e=>{if(!ZM.drag)return;ZM.x=e.clientX-ZM.drag.x;ZM.y=e.clientY-ZM.drag.y;ZM.moved=true;zoomApply();});
addEventListener("mouseup",()=>{if(ZM.drag){ZM.drag=null;$("zoom").classList.remove("dragging");}});
$("zoom").querySelector("img").addEventListener("dblclick",e=>{e.stopPropagation();zoomReset();});
$("zoom").querySelector(".zp").onclick=e=>{e.stopPropagation();step(-1);};$("zoom").querySelector(".zn").onclick=e=>{e.stopPropagation();step(1);};
addEventListener("keydown",e=>{if(!$("fv").classList.contains("on"))return;
 if(e.key==="Escape"){if($("zoom").classList.contains("on"))$("zoom").classList.remove("on");else closeFolder();}
 else if(e.target.tagName==="SELECT")return;else if((e.key==="p"||e.key==="P")&&$("zoom").classList.contains("on")){e.preventDefault();const x=FV.pics[FV.i];if(x)togglePublic(x);}else if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();step(1);}else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();step(-1);}});
$("allsw").onclick=()=>setAll($("allsw").getAttribute("aria-checked")!=="true");
$("tog").onclick=async()=>{$("tog").disabled=true;await fetch(S.state&&S.state.paused?"/api/resume":"/api/pause",{method:"POST"});loadState();};
(async()=>{const G=await fetch("/api/graph").then(r=>r.json());
 buildSphere();requestAnimationFrame(spin);S.last=G.last;
 G.nodes.slice().sort(byName).forEach(n=>folderCard(n,false));{let on=false;try{on=localStorage.getItem("vault_all")==="1";}catch(e){}setAll(on);}loadState();setInterval(loadState,5000);setInterval(poll,1500);})();
</script></body></html>
